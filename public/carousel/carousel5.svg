<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad5)" rx="10"/>
  
  <!-- 文档预览图标 -->
  <g transform="translate(60, 40)">
    <!-- 文档 -->
    <rect x="0" y="0" width="50" height="65" fill="white" opacity="0.9" rx="3"/>
    <!-- 折角 -->
    <polygon points="40,0 50,0 50,10 40,10" fill="#4facfe" opacity="0.6"/>
    <polygon points="40,0 50,10 40,10" fill="white" opacity="0.7"/>
    
    <!-- 文档内容线条 -->
    <rect x="8" y="15" width="25" height="2" fill="#4facfe" opacity="0.6"/>
    <rect x="8" y="22" width="30" height="2" fill="#4facfe" opacity="0.5"/>
    <rect x="8" y="29" width="20" height="2" fill="#4facfe" opacity="0.4"/>
    <rect x="8" y="36" width="28" height="2" fill="#4facfe" opacity="0.5"/>
    
    <!-- 放大镜 -->
    <circle cx="65" cy="30" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
    <line x1="75" y1="40" x2="85" y2="50" stroke="white" stroke-width="3" opacity="0.8"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    在线预览功能
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">
    支持多种格式，无需下载即可查看
  </text>
  
  <!-- 格式图标 -->
  <g transform="translate(280, 40)">
    <!-- PDF图标 -->
    <rect x="0" y="0" width="15" height="20" fill="white" opacity="0.7" rx="2"/>
    <text x="7.5" y="12" font-family="Arial" font-size="8" fill="#4facfe" text-anchor="middle" font-weight="bold">PDF</text>
    
    <!-- DOC图标 -->
    <rect x="20" y="0" width="15" height="20" fill="white" opacity="0.6" rx="2"/>
    <text x="27.5" y="12" font-family="Arial" font-size="7" fill="#4facfe" text-anchor="middle" font-weight="bold">DOC</text>
    
    <!-- IMG图标 -->
    <rect x="40" y="0" width="15" height="20" fill="white" opacity="0.5" rx="2"/>
    <text x="47.5" y="12" font-family="Arial" font-size="7" fill="#4facfe" text-anchor="middle" font-weight="bold">IMG</text>
  </g>
</svg> 