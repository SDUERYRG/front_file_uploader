<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad6)" rx="10"/>
  
  <!-- 文件分类图标 -->
  <g transform="translate(50, 50)">
    <!-- 文件夹1 -->
    <path d="M0 10 L15 10 L20 5 L45 5 L45 35 L0 35 Z" fill="white" opacity="0.9"/>
    <rect x="5" y="15" width="8" height="2" fill="#fa709a" opacity="0.6"/>
    <rect x="5" y="20" width="12" height="2" fill="#fa709a" opacity="0.5"/>
    
    <!-- 文件夹2 -->
    <path d="M55 15 L70 15 L75 10 L100 10 L100 40 L55 40 Z" fill="white" opacity="0.8"/>
    <rect x="60" y="20" width="8" height="2" fill="#fa709a" opacity="0.6"/>
    <rect x="60" y="25" width="12" height="2" fill="#fa709a" opacity="0.5"/>
    
    <!-- 箭头指向分类 -->
    <polygon points="25,50 35,55 25,60" fill="white" opacity="0.7"/>
    <line x1="15" y1="55" x2="25" y2="55" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    智能文件分类
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">
    自动识别文件类型，便捷管理查找
  </text>
  
  <!-- 分类标签 -->
  <g transform="translate(280, 50)">
    <!-- 文档标签 -->
    <rect x="0" y="0" width="30" height="15" fill="white" opacity="0.8" rx="7"/>
    <text x="15" y="10" font-family="Arial" font-size="9" fill="#fa709a" text-anchor="middle" font-weight="bold">文档</text>
    
    <!-- 图片标签 -->
    <rect x="0" y="20" width="30" height="15" fill="white" opacity="0.7" rx="7"/>
    <text x="15" y="30" font-family="Arial" font-size="9" fill="#fa709a" text-anchor="middle" font-weight="bold">图片</text>
    
    <!-- 视频标签 -->
    <rect x="0" y="40" width="30" height="15" fill="white" opacity="0.6" rx="7"/>
    <text x="15" y="50" font-family="Arial" font-size="9" fill="#fa709a" text-anchor="middle" font-weight="bold">视频</text>
  </g>
  
  <!-- 装饰性元素 -->
  <circle cx="350" cy="30" r="4" fill="white" opacity="0.5"/>
  <circle cx="370" cy="170" r="3" fill="white" opacity="0.6"/>
  <circle cx="30" cy="170" r="2" fill="white" opacity="0.7"/>
</svg> 