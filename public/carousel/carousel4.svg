<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad4)" rx="10"/>
  
  <!-- 上传箭头图标 -->
  <g transform="translate(70, 50)">
    <!-- 箭头主体 -->
    <polygon points="20,10 30,0 40,10 35,10 35,40 25,40 25,10" fill="white" opacity="0.9"/>
    <!-- 底座 -->
    <rect x="15" y="40" width="30" height="8" fill="white" opacity="0.8" rx="4"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    极速上传体验
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">
    支持拖拽上传，大文件秒传技术
  </text>
  
  <!-- 速度线条 -->
  <g transform="translate(280, 60)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="white" stroke-width="3" opacity="0.8"/>
    <line x1="5" y1="8" x2="25" y2="8" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="10" y1="16" x2="30" y2="16" stroke="white" stroke-width="3" opacity="0.4"/>
  </g>
  
  <!-- 进度条 -->
  <g transform="translate(150, 130)">
    <rect x="0" y="0" width="100" height="8" fill="white" opacity="0.3" rx="4"/>
    <rect x="0" y="0" width="75" height="8" fill="white" opacity="0.8" rx="4"/>
  </g>
</svg> 