<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad2)" rx="10"/>
  
  <!-- 团队协作图标 -->
  <g transform="translate(60, 60)">
    <!-- 人物1 -->
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.9"/>
    <rect x="-8" y="12" width="16" height="20" fill="white" opacity="0.8" rx="8"/>
    
    <!-- 人物2 -->
    <circle cx="30" cy="0" r="12" fill="white" opacity="0.9"/>
    <rect x="22" y="12" width="16" height="20" fill="white" opacity="0.8" rx="8"/>
    
    <!-- 人物3 -->
    <circle cx="60" cy="0" r="12" fill="white" opacity="0.9"/>
    <rect x="52" y="12" width="16" height="20" fill="white" opacity="0.8" rx="8"/>
    
    <!-- 连接线 -->
    <line x1="15" y1="15" x2="45" y2="15" stroke="white" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    高效团队协作
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">
    实时分享，便捷管理，提升工作效率
  </text>
  
  <!-- 装饰性文件图标 -->
  <g transform="translate(300, 40)">
    <rect x="0" y="0" width="20" height="25" fill="white" opacity="0.6" rx="2"/>
    <rect x="0" y="5" width="14" height="2" fill="#FF6B6B" opacity="0.8"/>
    <rect x="0" y="10" width="16" height="2" fill="#FF6B6B" opacity="0.6"/>
    <rect x="0" y="15" width="12" height="2" fill="#FF6B6B" opacity="0.4"/>
  </g>
</svg> 