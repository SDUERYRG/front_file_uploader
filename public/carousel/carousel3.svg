<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#grad3)" rx="10"/>
  
  <!-- 安全锁图标 -->
  <g transform="translate(80, 60)">
    <!-- 锁体 -->
    <rect x="0" y="20" width="40" height="30" fill="white" opacity="0.9" rx="5"/>
    <!-- 锁环 -->
    <path d="M10 20 Q10 5 20 5 Q30 5 30 20" stroke="white" stroke-width="4" fill="none" opacity="0.8"/>
    <!-- 钥匙孔 -->
    <circle cx="20" cy="35" r="3" fill="#667eea" opacity="0.8"/>
    <rect x="18" y="35" width="4" height="8" fill="#667eea" opacity="0.8"/>
  </g>
  
  <!-- 文字 -->
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    数据安全保障
  </text>
  <text x="200" y="110" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.9">
    企业级加密技术，保护您的隐私数据
  </text>
  
  <!-- 装饰性盾牌图标 -->
  <g transform="translate(300, 50)">
    <path d="M20 0 L30 10 L25 30 L15 30 L10 10 Z" fill="white" opacity="0.6"/>
    <path d="M20 5 L25 12 L22 25 L18 25 L15 12 Z" fill="#667eea" opacity="0.5"/>
  </g>
  
  <!-- 装饰点 -->
  <circle cx="340" cy="40" r="2" fill="white" opacity="0.6"/>
  <circle cx="360" cy="160" r="3" fill="white" opacity="0.4"/>
  <circle cx="30" cy="30" r="2.5" fill="white" opacity="0.5"/>
</svg> 